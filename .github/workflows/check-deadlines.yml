name: Check task deadlines

on:
  schedule:
    # 8:00 AM, 2:00 PM, 8:00 PM in Asia/Kolkata (IST, UTC+5:30) — converted
    # to UTC since GitHub Actions cron always runs in UTC.
    - cron: "30 2 * * *"    # 08:00 IST
    - cron: "30 8 * * *"    # 14:00 IST
    - cron: "30 14 * * *"   # 20:00 IST
  workflow_dispatch: {}    # lets you run it manually from the Actions tab to test

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (fresh, ignoring any stale lockfile)
        working-directory: scripts
        run: |
          rm -f package-lock.json
          npm install

      - name: Run deadline check
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: "mailto:you@example.com"
        run: node check-deadlines.js
